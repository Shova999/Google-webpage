<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/3d876d0ab5.js" crossorigin="anonymous"></script>
    <title>Google Clone</title>
    <link rel="stylesheet" href="google_clone.css">
</head>
<body>
    <!-- header start -->
    <section>
        <header>
            <ul id="first_line">
                <li id="c1" class="Effect"><a href="#"><i class="fa-solid fa-bars"></i></a></li>
                <li id="c2" class="Effect"><a href="#">
                    <ul>
                    <li><i class="fa-regular fa-folder"></i></li>
                    <li class="text">All Bookmarks</li>
                    </ul>
                    </a>
                </li>
            </ul>
            <hr>
            <ul id="sec_line">
                <li><a href="#" class="u_line">Gmail</a></li>
                <li><a href="#" class="u_line">Images</a></li>
                <li><a href="#" class="Effect"><i class="fa-solid fa-bars"></i></a></li>
                <li id="icon_ef"><a href="#" id="icon">M</a></li>
            </ul>
        </header>
    </section>
    <!-- header end -->

    <!-- Middle Start -->
    <section>
        <div id="middle">
            <div id="g_img"><img src="google_PNG.png" alt="google_img"></div>
            <div id="g_icon">
                <ul id="g1">
                    <li class="hover_m" id="m1"><a href="#"><i class="fa-solid fa-plus"></i></a></li>
                    <input type="text" placeholder="Ask anything">
                    <ul id="g2">
                        <li class="hover_m" id="m2"><a href="#"><i class="fa-solid fa-microphone"></i></a></li>
                        <div class="hover_m" id="m3">
                            <li id="b_circle">
                                <a href="#"><i class="fa-solid fa-circle"></i></a>
                            </li>
                        </div>
                        <li id="m4"><a href="#">
                            <ul id="g_ai" >
                                <li><i class="fa-solid fa-magnifying-glass"></i></li>
                                <li class="text">AI Mode</li>
                            </ul>
                        </a></li>
                    </ul>
                </ul>
            </div>

            <!-- Youtube part start -->
            
            <div id="Utube">

                <div class="shortcut">
                    <div class="bg">
                        <div id="tube_icon">
                            <a href="#">
                                <img src="youtube-logo-png.png" alt="Youtube">
                            </a>
                        </div>

                        <div class="U_text" id="U_text1">
                            <a href="#">www.youtub<br>e.com</a>
                        </div>
                    </div>
                    
                </div>


                <div class="shortcut">
                    <div class="bg">
                        <div id="plus_icon">
                            <a href="#">
                                <i class="fa-solid fa-plus"></i>
                            </a>
                        </div>

                        <div class="U_text" id="U_text2">
                            <a href="#">Add shortcut</a>
                        </div>
                    </div>
                    
                </div>

            </div>

            <!-- Youtube part end -->

        </div>
    </section>
    <!-- Middle End -->

  <!-- Footer part Start -->

    <section id="footer">
        <ul>
            <li><a href="#"><i class="fa-solid fa-pen"></i></a></li>
            <li class="text"><a href="#">Customize Crome</a></li>
        </ul>
    </section>

  <!-- Footer part End -->




<!-- Google page create done✅ -->
 
</body>
</html>
